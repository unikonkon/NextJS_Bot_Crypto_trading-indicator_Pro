<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- indicators — candles stepping up with an EMA-style line riding under them -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2232"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- faint price grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="4">
    <line x1="64" y1="152" x2="448" y2="152"/>
    <line x1="64" y1="240" x2="448" y2="240"/>
    <line x1="64" y1="328" x2="448" y2="328"/>
  </g>

  <!-- candles: one red, then three green stepping up -->
  <g stroke-linecap="round">
    <line x1="124" y1="226" x2="124" y2="350" stroke="#ef4444" stroke-width="12"/>
    <rect x="96" y="246" width="56" height="80" rx="10" fill="#ef4444"/>

    <line x1="208" y1="194" x2="208" y2="318" stroke="#10b981" stroke-width="12"/>
    <rect x="180" y="214" width="56" height="78" rx="10" fill="#10b981"/>

    <line x1="292" y1="146" x2="292" y2="270" stroke="#10b981" stroke-width="12"/>
    <rect x="264" y="164" width="56" height="84" rx="10" fill="#10b981"/>

    <line x1="376" y1="86" x2="376" y2="208" stroke="#10b981" stroke-width="12"/>
    <rect x="348" y="104" width="56" height="84" rx="10" fill="#10b981"/>
  </g>

  <!-- indicator line under the price -->
  <path d="M72 420 C 170 410, 230 384, 282 334 S 372 242, 432 222" fill="none" stroke="#0a0e16" stroke-width="36" stroke-linecap="round"/>
  <path d="M72 420 C 170 410, 230 384, 282 334 S 372 242, 432 222" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>

  <!-- signal dot -->
  <circle cx="432" cy="222" r="32" fill="#0a0e16"/>
  <circle cx="432" cy="222" r="23" fill="#fcd34d"/>
  <circle cx="432" cy="222" r="9" fill="#0a0e16"/>
</svg>
